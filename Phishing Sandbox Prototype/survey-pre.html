<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>入学前小调查 — 反诈小课堂</title>
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/survey.css" />
</head>
<body>
    <nav>
        <a href="home.html" class="nav-logo" data-i18n="brand">🛡️ 反诈小课堂</a>
        <div class="nav-right">
            <a href="home.html" class="nav-back" data-i18n="surveyBackHome">← 返回首页</a>
            <div class="lang-switch" id="langSwitch"></div>
        </div>
    </nav>

    <div class="survey-wrap" id="surveyForm">
        <div class="survey-header">
            <div class="eyebrow" data-i18n="preSurveyTag">开始之前</div>
            <h1 data-i18n="preSurveyTitle">入学前小调查</h1>
            <p data-i18n="preSurveyDesc">这不是考试，没有标准答案，任何题目都可以跳过。填完之后就能开始三节小课程。大约需要 3–5 分钟。</p>
        </div>

        <div class="survey-section-title" data-i18n="preSecA">A. 关于你</div>
        <div id="sectionA"></div>

        <div class="survey-section-title" data-i18n="preSecB">B. 你现在的想法（1–5 分）</div>
        <div class="survey-section-desc" data-i18n="preSecBDesc">请选出最符合你平时感受的选项。</div>
        <div id="sectionB"></div>

        <div class="survey-submit-bar">
            <button class="btn btn-primary" id="submitBtn" data-i18n="preSurveySubmitBtn">提交并开始学习 →</button>
        </div>
    </div>

    <div class="survey-wrap" id="surveyDone" style="display:none;">
        <div class="summary-panel" style="display:block;">
            <h2 id="doneMsg"></h2>
            <div class="summary-actions" style="margin-top:16px;">
                <a class="btn btn-primary" href="home.html" data-i18n="homeBtn">返回首页</a>
            </div>
        </div>
    </div>

    <footer data-i18n="footer">
        本课程仅用于防骗教育演示 · 遇到可疑情况请联系家人或当地警方 / 反诈骗机构
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/survey.js"></script>
    <script>
        initI18n('langSwitch');
        renderSurveySection('sectionA', SURVEY_PRE_BACKGROUND);
        renderSurveySection('sectionB', SURVEY_LIKERT);

        document.getElementById('submitBtn').addEventListener('click', () => {
            const formEl = document.getElementById('surveyForm');
            const answers = collectSurveyAnswers(formEl);
            savePreSurvey(answers);

            document.getElementById('doneMsg').textContent = t('preSurveyDoneMsg');
            formEl.style.display = 'none';
            document.getElementById('surveyDone').style.display = 'block';
        });
    </script>
</body>
</html>
