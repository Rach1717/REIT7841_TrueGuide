<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第三课：视频电话里的"儿子" — 反诈小课堂</title>
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/case.css" />
</head>
<body>
    <nav>
        <a href="home.html" class="nav-logo" data-i18n="brand">🛡️ 反诈小课堂</a>
        <div class="nav-right">
            <a href="home.html" class="nav-back" data-i18n="navBack">← 返回首页</a>
            <div class="lang-switch" id="langSwitch"></div>
        </div>
    </nav>

    <div class="case-header">
        <div class="eyebrow" data-i18n="c3Eyebrow">第三课 · AI换脸换声视频诈骗</div>
        <h1 data-i18n="c3PageTitle">🎥 视频电话里的"儿子"</h1>
        <p data-i18n="c3PageDesc">画面卡顿模糊的视频通话，那头真的是家人本人吗？跟着情景做出你的选择。</p>
    </div>

    <div class="phone-frame">
        <div class="call-header">
            <div class="call-avatar">🧑</div>
            <div class="call-name" data-i18n="c3CallName">儿子</div>
            <div class="call-status" data-i18n="c3CallStatus">视频通话中 · 00:14</div>
            <div class="call-video-box" data-i18n="c3CallVideo">📶 信号不稳定，画面模糊卡顿</div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="choice-area" id="choiceArea"></div>
        <div class="continue-bar" id="continueBar"></div>
    </div>

    <div class="summary-panel" id="summaryPanel" style="display:none;"></div>

    <footer data-i18n="footer">
        本课程仅用于防骗教育演示 · 遇到可疑情况请联系家人或当地警方 / 反诈骗机构
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/game.js"></script>
    <script src="js/case3.js"></script>
    <script>
        if (!isPreSurveyDone()) {
            window.location.href = 'survey-pre.html';
        } else {
            initI18n('langSwitch');
            const engine = new ChatEngine(CASE3_SCRIPT[getLang()], {
                chatAreaId: 'chatArea',
                choiceAreaId: 'choiceArea',
                continueBarId: 'continueBar',
                summaryId: 'summaryPanel',
                lessonId: 'case3'
            });
            engine.start();
        }
    </script>
</body>
</html>
