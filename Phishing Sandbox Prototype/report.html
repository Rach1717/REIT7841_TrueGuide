<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习前后对比报告 — 反诈小课堂</title>
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/report.css" />
</head>
<body>
    <nav>
        <a href="home.html" class="nav-logo" data-i18n="brand">🛡️ 反诈小课堂</a>
        <div class="nav-right">
            <a href="home.html" class="nav-back" data-i18n="surveyBackHome">← 返回首页</a>
            <div class="lang-switch" id="langSwitch"></div>
        </div>
    </nav>

    <div class="report-wrap" id="reportContent">
        <div class="report-header">
            <div class="eyebrow" data-i18n="reportTag">我的学习报告</div>
            <h1 data-i18n="reportTitle">学习前后对比报告</h1>
            <p data-i18n="reportDesc">下面是你完成三节课前后，同一份小调查的对比结果，仅供你自己参考。</p>
        </div>

        <div class="report-card">
            <div id="constructsContainer"></div>
        </div>

        <div class="report-card">
            <div class="report-card-title" data-i18n="reportLessonScores">三节课的判断成绩</div>
            <div id="lessonScores"></div>
            <div class="report-overall-score" id="overallScore"></div>
        </div>

        <div class="report-card" id="confidentTypesWrap" style="display:none;">
            <div class="report-card-title" data-i18n="reportConfidentTypes">结课时你更有信心识别：</div>
            <div class="report-confident-types" id="confidentTypesList"></div>
        </div>

        <div class="report-thanks" data-i18n="reportThanks">感谢你完成本次学习和调查！</div>

        <div class="survey-submit-bar">
            <a class="btn btn-primary" href="home.html" data-i18n="reportGoHome">返回首页</a>
        </div>
    </div>

    <div class="report-wrap report-empty" id="reportEmpty" style="display:none;">
        <p data-i18n="reportNoData">还没有完整的数据，请先完成入学前调查、三节课程和结课调查。</p>
        <a class="btn btn-primary" href="home.html" data-i18n="reportGoHome">返回首页</a>
    </div>

    <footer data-i18n="footer">
        本课程仅用于防骗教育演示 · 遇到可疑情况请联系家人或当地警方 / 反诈骗机构
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/report.js"></script>
    <script>
        initI18n('langSwitch');
        renderReport();
    </script>
</body>
</html>
